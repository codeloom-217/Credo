
spring:
  application:
    name: credo-backend

  config:
  import: optional:file:./.env[.properties]
  
  datasource:
    url: jdbc:postgresql://localhost:5432/credo_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

credo:
  ml:
    base-url: http://localhost:8000
